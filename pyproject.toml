[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"


[tool.poetry.group.dev.dependencies]
ruff = "^0.13.0"
poetry = { version = "^2.1.3", python = ">=3.12,<3.14" }  # 更新约束
build = "^1.2.2"
py-spy = "^0.4.0"
pytest = "^8.4.2"

[tool.poetry]
include = [
    ".env"
]
package-mode = true



[[tool.poetry.source]]
name = "aliyun"
url = "https://mirrors.aliyun.com/pypi/simple/"


[tool.poetry.group.optional.dependencies]
triton = { version = "^3.3.1", optional = true }

# 这里预留给三个环境特有的依赖
